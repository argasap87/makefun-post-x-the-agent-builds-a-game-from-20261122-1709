<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slide 1 — the one prompt</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:720px; overflow:hidden; }
  body {
    font-family: "Segoe UI", Arial, sans-serif; color:#e8f6ff;
    background:
      radial-gradient(900px 500px at 85% -10%, #7d5bff44, transparent 60%),
      radial-gradient(800px 500px at 0% 110%, #00e5ff33, transparent 60%),
      linear-gradient(135deg, #0b0620 0%, #160b3d 55%, #1d0b4d 100%);
  }
  .wrap { width:1280px; height:720px; padding:56px 90px; }
  .chip { display:inline-block; font-size:20px; font-weight:900; letter-spacing:4px;
    color:#191419; background:#ffe14d; border-radius:999px; padding:8px 22px;
    box-shadow:0 0 26px #ffe14d66; }
  .who { margin-top:26px; font-size:26px; color:#9fd8ff; font-weight:700; letter-spacing:1px; }
  .who b { color:#fff; }
  .who .dot { display:inline-block; width:14px; height:14px; border-radius:50%;
    background:#00ff9d; box-shadow:0 0 12px #00ff9d; margin-right:10px; vertical-align:2px; }
  .term { margin-top:28px; background:#05030fcc; border:2px solid #2b3a7a;
    border-radius:18px; box-shadow:0 0 40px #00e5ff22; overflow:hidden; }
  .term .bar { display:flex; align-items:center; gap:9px; padding:14px 18px;
    background:#141040; border-bottom:2px solid #2b3a7a; }
  .term .bar i { width:15px; height:15px; border-radius:50%; display:block; }
  .term .bar i:nth-child(1){ background:#ff5f57; } .term .bar i:nth-child(2){ background:#febc2e; }
  .term .bar i:nth-child(3){ background:#28c840; }
  .term .bar span { margin-left:10px; font-size:17px; color:#8fa8d8; font-family:monospace; }
  .term .body { padding:26px 28px 30px; min-height:250px; }
  .term .body .ps { color:#00ff9d; font-family:"DejaVu Sans Mono", monospace; font-size:30px; font-weight:700; }
  #typed { font-family:"DejaVu Sans Mono", monospace; font-size:30px; line-height:1.55;
    color:#dff4ff; white-space:pre-wrap; word-break:break-word; }
  #typed b { color:#7df9ff; }
  .cursor { display:inline-block; width:17px; height:36px; background:#ffe14d;
    vertical-align:-5px; margin-left:3px; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .foot { margin-top:30px; font-size:22px; letter-spacing:2px; color:#9fd8ff; font-weight:700; }
  .foot b { color:#ffe14d; }
</style>
</head>
<body>
<div class="wrap">
  <span class="chip">ONE PROMPT</span>
  <div class="who"><span class="dot"></span><b>you</b> &rarr; your AI agent &nbsp;·&nbsp; 30 seconds later, a game exists</div>
  <div class="term">
    <div class="bar"><i></i><i></i><i></i><span>agent — zsh — one prompt, no hand-written code</span></div>
    <div class="body"><span class="ps">$&nbsp;</span><span id="typed"></span><span class="cursor"></span></div>
  </div>
  <div class="foot">NO TEMPLATES &nbsp;·&nbsp; NO HAND-WRITTEN CODE &nbsp;·&nbsp; <b>ONE PROMPT</b></div>
</div>
<script>
const PROMPT = "Build a one-page HTML5 game: PULSE-PATH \u2014 a neon 4\u00d74 grid where one tap rotates a whole row AND column, guide the blue pulse from the left edge to the right edge before the 15-second timer runs out.";
const t = parseFloat(new URLSearchParams(location.search).get("t") || "0");
const n = Math.min(PROMPT.length, Math.floor(t * 55));
let html = "";
for (let i = 0; i < n; i++) {
  const ch = PROMPT[i];
  html += (ch === "P" && PROMPT.slice(i, i+10) === "PULSE-PATH") ? "<b>PULSE-PATH</b>" : ch.replace(/&/g,"&amp;").replace(/</g,"&lt;");
  if (PROMPT.slice(i, i+10) === "PULSE-PATH") i += 9;
}
document.getElementById("typed").innerHTML = html;
</script>
</body>
</html>
